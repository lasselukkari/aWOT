name: Unit Tests
on:
  push:
    paths: ["src/**", ".extras/**", ".github/workflows/NativeUnitTests.yml"]
  pull_request:
    paths: ["src/**", ".extras/**", ".github/workflows/NativeUnitTests.yml"]
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
  repository_dispatch:
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            flags: ""
          - name: macOS
            os: macos-latest
            flags: ""
          - name: Linux sanitizers
            os: ubuntu-latest
            flags: "-DAWOT_ENABLE_SANITIZERS=ON"
          - name: Linux Uno buffers and function pointers
            os: ubuntu-latest
            flags: "-DAWOT_ENABLE_SANITIZERS=ON -DAWOT_NO_STD_FUNCTION_MIDDLEWARE=ON -DAWOT_SMALL_BUFFERS=ON"
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S .extras/test -B .extras/test/build ${{ matrix.flags }}
      - name: Build
        run: cmake --build .extras/test/build --parallel 4
      - name: Test
        run: ctest --test-dir .extras/test/build --output-on-failure --parallel 4
      - name: Native macOS example
        if: runner.os == 'macOS'
        run: make -C .extras/MacOSNative test
  http-coverage:
    name: HTTP coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang coverage tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Configure
        run: >-
          cmake -S .extras/test -B .extras/test/build/coverage
          -DCMAKE_CXX_COMPILER=/usr/bin/clang++ -DAWOT_ENABLE_COVERAGE=ON
      - name: Run HTTP tests and collect coverage
        run: cmake --build .extras/test/build/coverage --target coverage-http --parallel 4
      - name: Coverage summary
        run: cat .extras/test/build/coverage/coverage-http/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: http-coverage
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .extras/test/build/coverage/coverage-http/html/
            .extras/test/build/coverage/coverage-http/summary.txt
            .extras/test/build/coverage/coverage-http/summary.md
            .extras/test/build/coverage/coverage-http/coverage.json
            .extras/test/build/coverage/coverage-http/coverage.lcov
  linux-native:
    name: Linux native example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S .extras/LinuxNative -B .extras/LinuxNative/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build .extras/LinuxNative/build --parallel 4
      - name: Test on Linux
        run: ctest --test-dir .extras/LinuxNative/build --output-on-failure
  windows-native:
    name: Windows native example
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - name: Configure
        run: cmake -S .extras/WindowsNative -B .extras/WindowsNative/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build .extras/WindowsNative/build --parallel 4
      - name: Test on Windows
        run: ctest --test-dir .extras/WindowsNative/build --output-on-failure
