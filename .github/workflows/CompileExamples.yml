name: Compile examples
on:
  push:
    paths: ["src/**", "examples/**", "library.properties", ".github/workflows/CompileExamples.yml"]
  pull_request:
    paths: ["src/**", "examples/**", "library.properties", ".github/workflows/CompileExamples.yml"]
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
  repository_dispatch:
jobs:
  boards:
    name: ${{ matrix.fqbn }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fqbn: arduino:avr:uno
            platform: arduino:avr
          - fqbn: arduino:avr:leonardo
            platform: arduino:avr
          - fqbn: arduino:avr:mega
            platform: arduino:avr
          - fqbn: arduino:sam:arduino_due_x
            platform: arduino:sam
          - fqbn: esp32:esp32:nodemcu-32s
            platform: esp32:esp32
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install platform and libraries
        run: |
          arduino-cli config init --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install '${{ matrix.platform }}'
          arduino-cli lib install Ethernet LoRa SD
      - name: Compile examples
        env:
          FQBN: ${{ matrix.fqbn }}
        shell: bash
        run: |
          failed=0
          while IFS= read -r sketch; do
            if [[ "$FQBN" != esp32:* ]] && grep -qE '#include <(ESP8266WiFi|WiFi|ETH)\.h>' "$sketch"; then
              continue
            fi
            echo "Compiling $sketch for $FQBN"
            if ! arduino-cli compile --fqbn "$FQBN" --library "$GITHUB_WORKSPACE" "$sketch"; then
              failed=1
            fi
          done < <(find examples -name '*.ino' | sort)
          exit "$failed"
