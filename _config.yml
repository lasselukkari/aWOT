# Site settings

# Build settings
markdown: kramdown

gems:
  - jekyll-redirect-from

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable : true

github: [metadata]

# Validation sources and dependency metadata are not published pages.
exclude:
  - vendor
  - scripts
  - README.md
  - CONTRIBUTING.md
  - RELEASE_CHECKLIST.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules
  - .docs-build
